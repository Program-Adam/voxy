buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.24'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'

group = project.mod_group
version = project.mod_version

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'

            mods {
                voxy {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', project.mod_id,
                 '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Minecraft supplies the LWJGL core; Voxy bundles the extra bindings and their native payloads.
    implementation platform('org.lwjgl:lwjgl-bom:3.3.3')
    implementation 'org.lwjgl:lwjgl'

    jarJar(implementation('org.lwjgl:lwjgl-lmdb:3.3.3')) {
        jarJar.ranged(it, '[3.3.3,3.3.4)')
    }
    jarJar(implementation('org.lwjgl:lwjgl-zstd:3.3.3')) {
        jarJar.ranged(it, '[3.3.3,3.3.4)')
    }
    jarJar(runtimeOnly('org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows')) {
        jarJar.ranged(it, '[3.3.3,3.3.4)')
    }
    jarJar(runtimeOnly('org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux')) {
        jarJar.ranged(it, '[3.3.3,3.3.4)')
    }
    jarJar(runtimeOnly('org.lwjgl:lwjgl-zstd:3.3.3:natives-windows')) {
        jarJar.ranged(it, '[3.3.3,3.3.4)')
    }
    jarJar(runtimeOnly('org.lwjgl:lwjgl-zstd:3.3.3:natives-linux')) {
        jarJar.ranged(it, '[3.3.3,3.3.4)')
    }

    jarJar(implementation('org.rocksdb:rocksdbjni:8.10.0')) {
        jarJar.ranged(it, '[8.10.0,8.10.1)')
    }
    jarJar(implementation('redis.clients:jedis:5.1.0')) {
        jarJar.ranged(it, '[5.1.0,5.1.1)')
    }
    jarJar(implementation('org.apache.commons:commons-pool2:2.12.0')) {
        jarJar.ranged(it, '[2.12.0,2.12.1)')
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.register('copyVoxyStorageSources', Copy) {
    from('../src/main/java') {
        include 'me/cortex/voxy/common/storage/**'
        include 'me/cortex/voxy/common/util/**'
        filter { line ->
            line
                .replace('net.minecraft.util.math.random.RandomSeed', 'net.minecraft.world.level.levelgen.RandomSupport')
                .replace('RandomSeed.mixStafford13', 'RandomSupport.mixStafford13')
                .replace('import me.cortex.voxy.common.world.WorldEngine;', 'import me.cortex.voxy.common.world.WorldSectionId;')
                .replace('WorldEngine.', 'WorldSectionId.')
                .replace('Streams.of(this.maps).map(Long2ObjectMap::values).flatMap(ObjectCollection::stream)',
                         'java.util.Arrays.stream(this.maps).map(Long2ObjectMap::values).flatMap(ObjectCollection::stream)')
                .replace('import org.apache.commons.lang3.stream.Streams;', '')
        }
    }
    into layout.buildDirectory.dir('generated/voxy-common-sources')
}

sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/voxy-common-sources')
tasks.named('compileJava').configure {
    dependsOn tasks.named('copyVoxyStorageSources')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: project.minecraft_version,
        forge_version: project.forge_version,
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mod_version: project.mod_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : project.mod_name,
            'Specification-Vendor'    : 'Voxy contributors',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'Voxy contributors',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('repo')
        }
    }
}
