name: Forge 1.20.1 port

on:
  push:
    branches:
      - port/forge-1.20.1-47.4.15
    paths:
      - 'forge-port/**'
      - '.github/workflows/forge-port.yml'
  pull_request:
    paths:
      - 'forge-port/**'
      - '.github/workflows/forge-port.yml'
  workflow_dispatch:

concurrency:
  group: forge-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge port
        run: gradle -p forge-port build

      - name: Upload Forge mod jar
        uses: actions/upload-artifact@v4
        with:
          name: voxy-forge-1.20.1-${{ github.sha }}
          path: forge-port/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
